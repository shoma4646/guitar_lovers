name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Test (TZ=Asia/Tokyo)
        run: npx jest --forceExit
        env:
          TZ: Asia/Tokyo

      - name: Test (TZ=UTC)
        run: npx jest --forceExit
        env:
          TZ: UTC
